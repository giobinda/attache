name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - name: Install musl target
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add "$TARGET"

      - name: Build
        run: cargo build --release --locked --target "$TARGET"

      - name: Assemble dist/
        run: |
          mkdir dist
          for b in attache-gate attache-mount-helper attache-import; do
            install -m 755 "target/$TARGET/release/$b" "dist/$b"
          done
          install -m 755 att dist/att
          install -m 755 install-mount-helper.sh dist/install-mount-helper.sh
          ( cd dist && sha256sum attache-gate attache-mount-helper attache-import att install-mount-helper.sh > SHA256SUMS )
          echo "--- SHA256SUMS ---"
          cat dist/SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Prebuilt static (musl) x86_64 Linux binaries, checksummed in \`SHA256SUMS\`.

          \`\`\`
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/bootstrap.sh | bash
          \`\`\`

          See the README for verification and the from-source path."
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "$notes" \
          || gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
